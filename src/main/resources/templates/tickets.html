<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mesa de Ayuda - Tickets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/tickets.css}">
</head>

<body th:classappend="${tema == 'oscuro'}
        ? 'tema-oscuro'
        : ''">

    <main class="container-fluid px-3 px-md-4 px-xxl-5 py-4">

        <header class="encabezado rounded-4 shadow-sm p-4 mb-4">

            <div class="row align-items-center g-4">

                <div class="col-12 col-lg">

                    <div class="text-center text-lg-start">

                        <p class="etiqueta-tickets mb-2">
                            MESA DE AYUDA
                        </p>

                        <h1 class="display-6 fw-bold mb-2">
                            Gestión de tickets
                        </h1>

                        <p class="descripcion-tickets fs-5 mb-0">
                            Registre, consulte y realice seguimiento
                            a las solicitudes de soporte.
                        </p>

                    </div>

                </div>

                <div class="col-12 col-lg-auto" th:if="${session.usuarioLogueado != null}">

                    <div class="d-flex flex-column flex-sm-row
                                align-items-stretch align-items-sm-center
                                justify-content-center gap-3">

                        <p class="usuario-activo mb-0 text-center">

                            Usuario activo:

                            <strong th:text="${session.usuarioLogueado.nombre}">
                                Usuario
                            </strong>

                        </p>

                        <form class="form-logout m-0" th:action="@{/logout}" method="post">

                            <button class="btn btn-danger btn-logout w-100" type="submit">
                                Cerrar sesión
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </header>

        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje}">

            <span th:text="${mensaje}">
                Operación completada correctamente.
            </span>

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar">
            </button>

        </div>

        <section class="tickets">

            <div class="row g-4 align-items-start">

                <div class="col-12 col-xl-3">

                    <div th:replace="~{
                        formulario-ticket :: formularioTicket
                    }">
                    </div>

                </div>

                <div class="col-12 col-xl-6">

                    <div th:replace="~{
                        listado-tickets :: listadoTickets
                    }">
                    </div>

                </div>

                <div class="col-12 col-xl-3">

                    <div th:replace="~{
                        busqueda-tickets :: busquedaTickets
                    }">
                    </div>

                </div>

            </div>

        </section>

        <div class="d-flex justify-content-center mt-4">

            <a class="btn btn-volver-menu" th:href="@{/menu}">
                ← Volver al menú
            </a>

        </div>

        <footer class="pie text-center py-4 mt-4">

            <p class="mb-0">
                Sistema de Mesa de Ayuda
            </p>

        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

</body>

</html>
