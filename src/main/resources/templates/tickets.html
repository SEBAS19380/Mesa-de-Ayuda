<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mesa de Ayuda - Tickets</title>

    <link rel="stylesheet" th:href="@{/css/tickets.css}">
</head>

<body>

    <main class="contenedor">

        <header class="encabezado">
            <h1>Mesa de Ayuda</h1>
            <p>Gestión y seguimiento de tickets</p>
        </header>

        <section class="tickets">

            <h2>Listado de Tickets</h2>
            
            <div class="mensaje-exito" th:if="${mensaje}" th:text="${mensaje}">
            </div>
            
            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Descripción</th>
                            <th>Prioridad</th>
                            <th>Responsable</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="ticket : ${tickets}">

                            <td th:text="${ticket.id}"></td>

                            <td th:text="${ticket.titulo}"></td>

                            <td th:text="${ticket.descripcion}"></td>

                            <td>
                                <span class="prioridad" th:text="${ticket.prioridad}">
                                </span>
                            </td>

                            <td th:text="${ticket.responsable}"></td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <details class="agregar-ticket">

                <summary>
                    ＋ Agregar nuevo ticket
                </summary>

                <div class="formulario-ticket">

                    <h2>Agregar nuevo ticket</h2>

                    <form th:action="@{/tickets/agregar}" th:object="${ticket}" method="post">

                        <div class="campo">

                            <label for="titulo">
                                Título:
                            </label>

                            <input type="text" id="titulo" th:field="*{titulo}">

                            <div class="mensaje-error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">
                            </div>

                        </div>

                        <div class="campo">

                            <label for="descripcion">
                                Descripción:
                            </label>

                            <textarea id="descripcion" th:field="*{descripcion}" rows="4"></textarea>

                            <div class="mensaje-error" th:if="${#fields.hasErrors('descripcion')}"
                                th:errors="*{descripcion}">
                            </div>

                        </div>

                        <div class="campo">

                            <label for="prioridad">
                                Prioridad:
                            </label>

                            <select id="prioridad" th:field="*{prioridad}">

                                <option value="">
                                    Seleccione una prioridad
                                </option>

                                <option value="ALTA">
                                    ALTA
                                </option>

                                <option value="MEDIA">
                                    MEDIA
                                </option>

                                <option value="BAJA">
                                    BAJA
                                </option>

                            </select>

                            <div class="mensaje-error" th:if="${#fields.hasErrors('prioridad')}"
                                th:errors="*{prioridad}">
                            </div>

                        </div>

                        <div class="campo">

                            <label for="responsable">
                                Responsable:
                            </label>

                            <input type="text" id="responsable" th:field="*{responsable}">

                            <div class="mensaje-error" th:if="${#fields.hasErrors('responsable')}"
                                th:errors="*{responsable}">
                            </div>

                        </div>

                        <button type="submit">
                            Agregar ticket
                        </button>

                    </form>

                </div>

            </details>

        </section>

        <footer class="pie">

            <p>Sistema de Mesa de Ayuda</p>

        </footer>

    </main>

</body>

</html>
