<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mesa de Ayuda - Tickets</title>

    <link rel="stylesheet" th:href="@{/css/tickets.css}">
</head>

<body>

    <main class="contenedor">

        <header class="encabezado">
            <h1>Mesa de Ayuda</h1>
            <p>Gestión y seguimiento de tickets</p>
        </header>

        <section class="tickets">

            <h2>Listado de Tickets</h2>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Descripción</th>
                            <th>Prioridad</th>
                            <th>Responsable</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="ticket : ${tickets}">

                            <td th:text="${ticket.id}"></td>

                            <td th:text="${ticket.titulo}"></td>

                            <td th:text="${ticket.descripcion}"></td>

                            <td>
                                <span
                                    class="prioridad"
                                    th:text="${ticket.prioridad}">
                                </span>
                            </td>

                            <td th:text="${ticket.responsable}"></td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

        <footer class="pie">

            <p>Sistema de Mesa de Ayuda</p>

        </footer>

    </main>

</body>

</html>
