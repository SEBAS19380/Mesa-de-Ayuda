<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mesa de Ayuda</title>

    <!-- Bootstrap 5.3.8 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/inicio.css}">
</head>

<body>

    <main class="container-fluid min-vh-100 d-flex align-items-center py-4">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                    <section class="card tarjeta border-0 shadow-lg">

                        <div class="card-body p-4 p-md-5 text-center">

                            <div class="mb-4">

                                <span class="badge rounded-pill px-3 py-2 etiqueta-sistema">
                                    SOPORTE Y SEGUIMIENTO
                                </span>

                            </div>

                            <h1 class="display-5 fw-bold mb-3">
                                Mesa de Ayuda
                            </h1>

                            <p class="lead mb-4">
                                Sistema de gestión y seguimiento de tickets
                                de soporte.
                            </p>

                            <div class="d-grid gap-3">

                                <a th:href="@{/login}" class="btn boton btn-lg">
                                    Iniciar sesión
                                </a>

                                <a th:href="@{/registro}" class="btn boton boton-secundario btn-lg">
                                    Crear cuenta
                                </a>

                            </div>

                            <p class="texto-informativo small mt-4 mb-0">
                                Registre, consulte y realice seguimiento
                                a sus solicitudes de soporte.
                            </p>

                        </div>

                    </section>

                </div>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

</body>

</html>
