<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Mesa de Ayuda</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/inicio.css}">
</head>

<body>

    <main class="container-fluid min-vh-100 d-flex align-items-center py-4">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                    <section class="card tarjeta border-0 shadow-lg">

                        <div class="card-body p-4 p-md-5">

                            <div class="text-center mb-4">

                                <span class="badge rounded-pill px-3 py-2 mb-3 etiqueta-sistema">
                                    ACCESO AL SISTEMA
                                </span>

                                <h1 class="h2 fw-bold mb-2">
                                    Iniciar sesión
                                </h1>

                                <p class="texto-informativo mb-0">
                                    Ingrese sus credenciales para acceder
                                    a la Mesa de Ayuda.
                                </p>

                            </div>

                            <div class="alert alert-danger mensaje-error" role="alert" th:if="${error}"
                                th:text="${error}">
                                Correo o contraseña incorrectos
                            </div>

                            <form th:action="@{/login}" th:object="${usuario}" method="post">

                                <div class="mb-3">

                                    <label for="correo" class="form-label fw-semibold">
                                        Correo electrónico
                                    </label>

                                    <input type="email" id="correo" class="form-control form-control-lg"
                                        placeholder="correo@ejemplo.com" autocomplete="email" th:field="*{correo}">

                                </div>

                                <div class="mb-4">

                                    <label for="password" class="form-label fw-semibold">
                                        Contraseña
                                    </label>

                                    <input type="password" id="password" class="form-control form-control-lg"
                                        placeholder="Ingrese su contraseña" autocomplete="current-password"
                                        th:field="*{password}">

                                </div>

                                <div class="d-grid">

                                    <button type="submit" class="btn boton btn-lg">
                                        Ingresar
                                    </button>

                                </div>

                            </form>

                            <div class="text-center mt-4">

                                <p class="texto-informativo mb-2">
                                    ¿Todavía no tiene una cuenta?
                                </p>

                                <a th:href="@{/registro}" class="enlace-secundario">
                                    Crear una cuenta
                                </a>

                            </div>

                            <div class="text-center mt-3">

                                <a th:href="@{/}" class="enlace-regreso">
                                    Volver al inicio
                                </a>

                            </div>

                        </div>

                    </section>

                </div>

            </div>

        </div>

    </main>

    https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js </script>

</body>

</html>
